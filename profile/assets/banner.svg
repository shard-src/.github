<svg xmlns="http://www.w3.org/2000/svg" width="880" height="382" viewBox="0 0 880 382" role="img" aria-label="SHARD studio whoami card: craft, base, status, stack">
  <defs>
    <style>
      text { font-family: ui-monospace, 'Cascadia Code', 'JetBrains Mono', Menlo, Consolas, monospace; }
      .tag  { fill: #0b0906; font-size: 12px; font-weight: 700; letter-spacing: 2px; }
      .name { fill: #e8dcc0; font-size: 14px; }
      .val  { fill: #9a7b2e; font-size: 13px; }
      .hi   { fill: #ffb000; font-size: 13px; }
      .ft   { fill: #8a6d33; font-size: 12px; }
      .ttl  { fill: #8a6d33; font-size: 12px; letter-spacing: 2px; }
      .sec  { opacity: 0; }
    </style>
  </defs>

  <rect x="6" y="6" width="868" height="370" rx="6" fill="#0b0906" stroke="#4a3b1a" stroke-width="1.5"/>
  <rect x="356" y="0" width="168" height="13" fill="#0b0906"/>
  <text class="ttl" x="440" y="11" text-anchor="middle">shard.team — whoami</text>

  <!-- STUDIO -->
  <g class="sec">
    <rect x="32" y="36" width="80" height="22" rx="2" fill="#ffb000"/>
    <text class="tag" x="72" y="51" text-anchor="middle">STUDIO</text>
    <line x1="124" y1="47" x2="848" y2="47" stroke="#4a3b1a" stroke-width="1.5" stroke-dasharray="2 5"/>
    <animate attributeName="opacity" from="0" to="1" begin="0.15s" dur="0.1s" fill="freeze"/>
  </g>

  <g class="sec">
    <text class="name" x="32" y="88">craft</text>
    <line x1="69" y1="84" x2="250" y2="84" stroke="#4a3b1a" stroke-width="1.5" stroke-dasharray="1.5 5"/>
    <text class="val" x="260" y="88">engineering modern web experiences</text>
    <animate attributeName="opacity" from="0" to="1" begin="0.3s" dur="0.1s" fill="freeze"/>
  </g>
  <g class="sec">
    <text class="name" x="32" y="120">base</text>
    <line x1="64" y1="116" x2="250" y2="116" stroke="#4a3b1a" stroke-width="1.5" stroke-dasharray="1.5 5"/>
    <text class="val" x="260" y="120">Almaty, Kazakhstan</text>
    <animate attributeName="opacity" from="0" to="1" begin="0.45s" dur="0.1s" fill="freeze"/>
  </g>
  <g class="sec">
    <text class="name" x="32" y="152">status</text>
    <line x1="76" y1="148" x2="250" y2="148" stroke="#4a3b1a" stroke-width="1.5" stroke-dasharray="1.5 5"/>
    <text class="hi" x="260" y="152">available for new projects</text>
    <animate attributeName="opacity" from="0" to="1" begin="0.6s" dur="0.1s" fill="freeze"/>
  </g>

  <!-- STACK -->
  <g class="sec">
    <rect x="32" y="192" width="72" height="22" rx="2" fill="#ffb000"/>
    <text class="tag" x="68" y="207" text-anchor="middle">STACK</text>
    <line x1="116" y1="203" x2="848" y2="203" stroke="#4a3b1a" stroke-width="1.5" stroke-dasharray="2 5"/>
    <animate attributeName="opacity" from="0" to="1" begin="0.75s" dur="0.1s" fill="freeze"/>
  </g>

  <g class="sec">
    <text class="name" x="32" y="244">frontend</text>
    <line x1="99" y1="240" x2="250" y2="240" stroke="#4a3b1a" stroke-width="1.5" stroke-dasharray="1.5 5"/>
    <text class="val" x="260" y="244">react · next · vue · nuxt</text>
    <animate attributeName="opacity" from="0" to="1" begin="0.9s" dur="0.1s" fill="freeze"/>
  </g>
  <g class="sec">
    <text class="name" x="32" y="276">backend</text>
    <line x1="91" y1="272" x2="250" y2="272" stroke="#4a3b1a" stroke-width="1.5" stroke-dasharray="1.5 5"/>
    <text class="val" x="260" y="276">node · python · go · graphql</text>
    <animate attributeName="opacity" from="0" to="1" begin="1.05s" dur="0.1s" fill="freeze"/>
  </g>
  <g class="sec">
    <text class="name" x="32" y="308">infra</text>
    <line x1="64" y1="304" x2="250" y2="304" stroke="#4a3b1a" stroke-width="1.5" stroke-dasharray="1.5 5"/>
    <text class="val" x="260" y="308">postgres · redis · docker · k8s · aws</text>
    <animate attributeName="opacity" from="0" to="1" begin="1.2s" dur="0.1s" fill="freeze"/>
  </g>

  <!-- footer -->
  <line x1="32" y1="338" x2="848" y2="338" stroke="#4a3b1a" stroke-width="1.5" stroke-dasharray="2 5"/>
  <text class="ft" x="32" y="366">site <tspan fill="#57451f">·······················································································</tspan> <tspan fill="#ffb000">shard.team</tspan></text>
</svg>
